[project]
name = "nexhire-backend"
version = "0.1.0"
description = "NexHire — AI-powered intern referral management platform (modular monolith)"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── Web framework ────────────────────────────────────
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # ── Persistence ──────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # ── Auth ─────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "msal>=1.31.0",
    "bcrypt>=4.2.0",
    # ── Azure ────────────────────────────────────────────
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    "azure-storage-blob>=12.24.0",
    "openai>=1.55.0",
    "msgraph-sdk>=1.12.0",
    "azure-ai-documentintelligence>=1.0.0",
    # ── Email & document ─────────────────────────────────
    "google-api-python-client>=2.149.0",
    "google-auth>=2.36.0",
    "weasyprint>=63.0",
    "jinja2>=3.1.4",
    # ── Scheduler & cache ────────────────────────────────
    "apscheduler>=3.11.0",
    "redis>=5.2.0",
    # ── Observability ────────────────────────────────────
    "structlog>=24.4.0",
    "opencensus-ext-azure>=1.1.13",
    # ── Utilities ────────────────────────────────────────
    "rapidfuzz>=3.10.0",          # jaro-winkler for name fuzzy match
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",   # multipart form uploads
    "tenacity>=9.0.0",            # retries
    "python-dateutil>=2.9.0",     # relativedelta for month arithmetic
    "psycopg2-binary>=2.9.12",
    "reportlab>=4.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgresql,redis]>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4.20240106",
    "types-redis>=4.6.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false                    # this is an app, not a library

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC", # async-specific lints
    "S",    # bandit security
    "RUF",  # ruff-specific
    "TCH",  # flake8-type-checking
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]      # test secrets, RNG OK in tests
"migrations/**/*.py" = ["E501"]                 # long alembic lines OK

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

# SQLAlchemy 2's MappedAsDataclass support in mypy is incomplete: the plugin
# doesn't model `mapped_column(server_default=...)` as having a Python-side
# default, so every server-defaulted column is reported as required, and
# every PK with `default_factory=uuid4` follows. Disable the affected codes
# in modules that construct ORM rows. Real call-arg / misc bugs in non-ORM
# code paths are unaffected.
[[tool.mypy.overrides]]
module = [
    "app.modules.*.service",
    "app.modules.*.event_handlers",
    "app.modules.*.models",
    "app.modules.*.magic_link",
    "app.modules.*.auto_lock",
    "app.modules.*.recall",
    "app.modules.*.auto_approval",
    "app.modules.*.hr_service",
    "app.modules.*.config_service",
    "app.modules.*.certificate",
    "app.modules.*.auto_router",
    "app.modules.*.bottleneck",
    "app.modules.*.action_tokens",
    "app.modules.*.cooling_period_service",
    "app.modules.*.offer_letter",
    "app.infrastructure.outbox_models",
]
disable_error_code = ["call-arg", "misc"]

# Third-party libraries shipped without type stubs.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "apscheduler.*",
    "weasyprint",
    "weasyprint.*",
    "dateutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
